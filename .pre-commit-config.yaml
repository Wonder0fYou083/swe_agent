# Git hooks, installed once with `uv run pre-commit install`.
# Run them on every file with `uv run pre-commit run --all-files`.
repos:
  # Ruff runs from the project venv, so the hooks, CI and your editor all use
  # the single ruff version pinned in uv.lock. `unsupported` (formerly `system`)
  # means pre-commit runs the command as-is instead of building its own env.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi, markdown]  # ruff also formats Python code blocks in Markdown
        require_serial: true

  # Blocks commits that contain API keys or other secrets.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
